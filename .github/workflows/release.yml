name: Release

# Push a tag named <workflow id>-v<version>, for example character-sheet-v1.0.0, to publish that workflow's zip.
# Each workflow gets its own release asset so its download count can be read on its own.
on:
  push:
    tags: ["*-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate.py
      - name: Build zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          ID="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          MANIFEST_VERSION=$(python -c "import yaml; print(yaml.safe_load(open('workflows/$ID/manifest.yaml'))['version'])")
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version $VERSION does not match workflows/$ID/manifest.yaml version $MANIFEST_VERSION"
            exit 1
          fi
          mkdir dist
          (cd workflows && zip -r "../dist/$TAG.zip" "$ID" -x "$ID/tests/*")
          echo "ID=$ID" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --notes "See workflows/$ID/README.md."
